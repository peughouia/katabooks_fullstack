name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./katabooks

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Donner les droits d'exécution à Gradle
        run: chmod +x ./gradlew

      - name: Compiler le projet
        run: ./gradlew assemble

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build-backend
    defaults:
      run:
        working-directory: ./katabooks

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Donner les droits d'exécution à Gradle
        run: chmod +x ./gradlew

      - name: Lancer les tests
        run: ./gradlew test

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    defaults:
      run:
        working-directory: ./katabooks

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: chmod +x ./gradlew

      - run: ./gradlew integrationTest

